# SCPN Mirror Core — native kernel crate manifest

[package]
name = "scpn-mirror-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "AGPL-3.0-or-later"
description = "Native level-0 device-physics kernels of SCPN Mirror Core, bit-exact with the Python floor"
publish = false

[lib]
name = "scpn_mirror_native"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
# The shared kernel library at the commit pinned in reactor-domain.json
# (kernel_library.source_commit); its vendored logarithm, exponential and
# power are the same series the Python floor evaluates.
scpn-reactor-kernels-rs = { git = "https://github.com/anulum/scpn-reactor-kernels.git", rev = "6f574bfdddadf24c6a4c0a020c0a257fec38231a", default-features = false }
pyo3 = { version = "0.29", features = ["extension-module"], optional = true }

[lints.rust]
# Every public item of a native surface carries rustdoc. A binding that
# ships without documentation is debt the next reader pays, so it does not
# ship: the gate is the compiler's, not a review habit.
missing_docs = "deny"
missing_debug_implementations = "deny"
unsafe_code = "deny"

[lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_rust_codeblocks = "deny"

[profile.release]
codegen-units = 1
lto = "fat"
